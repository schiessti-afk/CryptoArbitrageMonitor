<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Crypto Arbitrage Monitor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('crypto-arbitrage-monitor:settings');
        var theme = 'dark';
        var density = 'comfortable';
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark' || parsed.theme === 'system')) {
            theme = parsed.theme;
          }
          if (parsed && (parsed.density === 'compact' || parsed.density === 'comfortable')) {
            density = parsed.density;
          }
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-density', density);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-density', 'comfortable');
      }
    })();
  </script>
  <script>
    // Polyfill for sockjs-client - MUST run before any modules load
    window.global = window;
    window.globalThis = window;
    window.process = { env: { NODE_ENV: 'development' } };
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
