@if (open()) {
  <div class="fixed inset-0 z-40 flex justify-end" role="dialog" aria-modal="true" aria-label="Dashboard settings">
    <button type="button" class="absolute inset-0 bg-black/40" (click)="close()" aria-label="Close settings"></button>

    <aside class="relative z-50 w-full max-w-md h-full panel shadow-xl overflow-y-auto focus:outline-none">
      <div class="sticky top-0 panel border-b border-theme px-4 py-3 flex items-center justify-between">
        <h2 class="text-lg font-bold">Settings</h2>
        <button type="button" class="btn-icon" (click)="close()" aria-label="Close">✕</button>
      </div>

      <div class="p-4 space-y-6">
        <section>
          <h3 class="font-semibold mb-3">Venues</h3>
          <div class="space-y-2">
            @for (ex of exchanges(); track ex.exchange) {
              <label class="flex items-center justify-between gap-3 py-2">
                <span class="flex items-center gap-2 text-sm">
                  <span class="inline-block w-2 h-2 rounded-full"
                        [class.bg-green-500]="ex.freshness === 'FRESH'"
                        [class.bg-yellow-500]="ex.freshness === 'STALE'"
                        [class.bg-gray-400]="ex.freshness === 'NEVER'"></span>
                  {{ ex.exchange }}
                  <span class="text-muted text-xs">({{ ex.offeredQuoteAssets.join(', ') }})</span>
                </span>
                <input type="checkbox"
                       [checked]="isExchangeEnabled(ex.exchange)"
                       (change)="settings.toggleExchange(ex.exchange, $any($event.target).checked)"
                       class="w-5 h-5" />
              </label>
            }
          </div>
        </section>

        <section>
          <h3 class="font-semibold mb-3">Markets</h3>
          @for (quote of config().quoteAssets; track quote) {
            <div class="mb-4">
              <p class="text-xs uppercase tracking-wide text-muted mb-2">{{ quote }}</p>
              <div class="space-y-2">
                @for (symbol of symbolsByQuote(quote); track symbol) {
                  <label class="flex items-center justify-between gap-3 py-1">
                    <span class="text-sm">{{ symbol }}</span>
                    <input type="checkbox"
                           [checked]="isSymbolEnabled(symbol)"
                           (change)="settings.toggleSymbol(symbol, $any($event.target).checked)"
                           class="w-5 h-5" />
                  </label>
                }
              </div>
            </div>
          }
        </section>

        <section>
          <h3 class="font-semibold mb-3">Opportunities</h3>
          <label class="block text-sm mb-2">Min net spread (%)</label>
          <input type="number" step="0.01" min="0"
                 class="input w-full mb-3"
                 [ngModel]="settings.settings().minNetSpreadPercent"
                 (ngModelChange)="patch({ minNetSpreadPercent: $event })" />
          <div class="space-y-2 text-sm">
            <label class="flex items-center gap-2">
              <input type="radio" name="thresholdMode" [value]="false"
                     [checked]="!settings.settings().hideBelowThreshold"
                     (change)="patch({ hideBelowThreshold: false })" />
              Dim below threshold
            </label>
            <label class="flex items-center gap-2">
              <input type="radio" name="thresholdMode" [value]="true"
                     [checked]="settings.settings().hideBelowThreshold"
                     (change)="patch({ hideBelowThreshold: true })" />
              Hide below threshold
            </label>
          </div>
        </section>

        <section>
          <h3 class="font-semibold mb-3">Appearance</h3>
          <label class="block text-sm mb-1">Theme</label>
          <select class="input w-full mb-3"
                  [ngModel]="settings.settings().theme"
                  (ngModelChange)="patch({ theme: $event })">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <label class="block text-sm mb-1">Density</label>
          <select class="input w-full"
                  [ngModel]="settings.settings().density"
                  (ngModelChange)="patch({ density: $event })">
            <option value="comfortable">Comfortable</option>
            <option value="compact">Compact</option>
          </select>
        </section>

        <section>
          <h3 class="font-semibold mb-3">Advanced</h3>
          <label class="block text-sm mb-1">
            Freshness window (ms)
            @if (settings.settings().freshnessWindowMsOverride !== null) {
              <span class="text-amber-600 text-xs ml-1">override active</span>
            }
          </label>
          <input type="number" class="input w-full mb-3"
                 [placeholder]="config().freshnessWindowMs.toString()"
                 [ngModel]="settings.settings().freshnessWindowMsOverride"
                 (ngModelChange)="patch({ freshnessWindowMsOverride: $event === '' || $event === null ? null : +$event })" />

          <label class="block text-sm mb-1">
            Default notional
            @if (settings.settings().defaultNotionalOverride !== null) {
              <span class="text-amber-600 text-xs ml-1">override active</span>
            }
          </label>
          <input type="number" class="input w-full"
                 [placeholder]="config().defaultNotional.toString()"
                 [ngModel]="settings.settings().defaultNotionalOverride"
                 (ngModelChange)="patch({ defaultNotionalOverride: $event === '' || $event === null ? null : +$event })" />
        </section>

        <button type="button" class="btn-secondary w-full" (click)="reset()">Reset to defaults</button>
      </div>
    </aside>
  </div>
}
