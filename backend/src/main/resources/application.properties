spring.application.name=crypto-arbitrage-monitor

# Datasource (override via env in Docker / local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5437/arbitrage}
spring.datasource.username=${DATABASE_USERNAME:arbitrage}
spring.datasource.password=${DATABASE_PASSWORD:arbitrage}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8081

# Exchange configuration
exchange.binance.base-url=https://api.binance.com
exchange.binance.connect-timeout-ms=5000
exchange.binance.response-timeout-ms=10000
exchange.binance.symbol-map.BTC_USD=BTCUSD
exchange.binance.symbol-map.ETH_USD=ETHUSD

exchange.kraken.base-url=https://api.kraken.com
exchange.kraken.connect-timeout-ms=5000
exchange.kraken.response-timeout-ms=10000
exchange.kraken.symbol-map.BTC_USD=XXBTZUSD
exchange.kraken.symbol-map.ETH_USD=XETHZUSD

exchange.coinbase.base-url=https://api.exchange.coinbase.com
exchange.coinbase.connect-timeout-ms=5000
exchange.coinbase.response-timeout-ms=10000
exchange.coinbase.symbol-map.BTC_USD=BTC-USD
exchange.coinbase.symbol-map.ETH_USD=ETH-USD

# Application configuration
app.polling.interval-ms=3000
app.polling.freshness-window-ms=10000
app.investment.default-notional=1000
