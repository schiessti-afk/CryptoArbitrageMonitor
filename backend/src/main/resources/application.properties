spring.application.name=crypto-arbitrage-monitor

# Datasource (override via env in Docker / local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5437/arbitrage}
spring.datasource.username=${DATABASE_USERNAME:arbitrage}
spring.datasource.password=${DATABASE_PASSWORD:arbitrage}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8081

# Exchange configuration
# Each adapter lists exactly the markets it offers under `markets.<INTERNAL_SYMBOL>`.
# Absence of an entry means the venue does not list that market — see MarketConfigValidator
# and ExchangeAdapter#supports, both of which read this config as the single source of truth.

exchange.adapters.binance.base-url=https://api.binance.com
exchange.adapters.binance.connect-timeout-ms=5000
exchange.adapters.binance.response-timeout-ms=10000
exchange.adapters.binance.markets.BTC_USD.native-symbol=BTCUSD
exchange.adapters.binance.markets.BTC_USD.quote-asset=USD
exchange.adapters.binance.markets.ETH_USD.native-symbol=ETHUSD
exchange.adapters.binance.markets.ETH_USD.quote-asset=USD
exchange.adapters.binance.markets.BTC_USDT.native-symbol=BTCUSDT
exchange.adapters.binance.markets.BTC_USDT.quote-asset=USDT
exchange.adapters.binance.markets.ETH_USDT.native-symbol=ETHUSDT
exchange.adapters.binance.markets.ETH_USDT.quote-asset=USDT

exchange.adapters.kraken.base-url=https://api.kraken.com
exchange.adapters.kraken.connect-timeout-ms=5000
exchange.adapters.kraken.response-timeout-ms=10000
exchange.adapters.kraken.markets.BTC_USD.native-symbol=XXBTZUSD
exchange.adapters.kraken.markets.BTC_USD.quote-asset=USD
exchange.adapters.kraken.markets.ETH_USD.native-symbol=XETHZUSD
exchange.adapters.kraken.markets.ETH_USD.quote-asset=USD
# Kraken's USDT symbols do not follow its USD naming convention (no X../Z.. wrapping),
# and the response is keyed by the *native* symbol below (e.g. "XBTUSDT", not "BTCUSDT")
# — verified live: querying pair=BTCUSDT returns a result object keyed "XBTUSDT".
exchange.adapters.kraken.markets.BTC_USDT.native-symbol=XBTUSDT
exchange.adapters.kraken.markets.BTC_USDT.quote-asset=USDT
exchange.adapters.kraken.markets.ETH_USDT.native-symbol=ETHUSDT
exchange.adapters.kraken.markets.ETH_USDT.quote-asset=USDT

exchange.adapters.coinbase.base-url=https://api.exchange.coinbase.com
exchange.adapters.coinbase.connect-timeout-ms=5000
exchange.adapters.coinbase.response-timeout-ms=10000
exchange.adapters.coinbase.markets.BTC_USD.native-symbol=BTC-USD
exchange.adapters.coinbase.markets.BTC_USD.quote-asset=USD
exchange.adapters.coinbase.markets.ETH_USD.native-symbol=ETH-USD
exchange.adapters.coinbase.markets.ETH_USD.quote-asset=USD
exchange.adapters.coinbase.markets.BTC_USDT.native-symbol=BTC-USDT
exchange.adapters.coinbase.markets.BTC_USDT.quote-asset=USDT
exchange.adapters.coinbase.markets.ETH_USDT.native-symbol=ETH-USDT
exchange.adapters.coinbase.markets.ETH_USDT.quote-asset=USDT

# Bitget and KuCoin are USDT-only for BTC/ETH spot — verified live, no BTC_USD / ETH_USD
# entries below on purpose. Polling only requests markets present in this config
# (see ExchangeAdapter#supports), so these venues are never queried for a USD market
# and never show as a failure for one.
exchange.adapters.bitget.base-url=https://api.bitget.com
exchange.adapters.bitget.connect-timeout-ms=5000
exchange.adapters.bitget.response-timeout-ms=10000
exchange.adapters.bitget.markets.BTC_USDT.native-symbol=BTCUSDT
exchange.adapters.bitget.markets.BTC_USDT.quote-asset=USDT
exchange.adapters.bitget.markets.ETH_USDT.native-symbol=ETHUSDT
exchange.adapters.bitget.markets.ETH_USDT.quote-asset=USDT

exchange.adapters.kucoin.base-url=https://api.kucoin.com
exchange.adapters.kucoin.connect-timeout-ms=5000
exchange.adapters.kucoin.response-timeout-ms=10000
exchange.adapters.kucoin.markets.BTC_USDT.native-symbol=BTC-USDT
exchange.adapters.kucoin.markets.BTC_USDT.quote-asset=USDT
exchange.adapters.kucoin.markets.ETH_USDT.native-symbol=ETH-USDT
exchange.adapters.kucoin.markets.ETH_USDT.quote-asset=USDT

# Application configuration
app.polling.interval-ms=3000
app.polling.freshness-window-ms=10000
app.investment.default-notional=1000
