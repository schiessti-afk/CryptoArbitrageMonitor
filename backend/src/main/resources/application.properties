spring.application.name=crypto-arbitrage-monitor

# Datasource (override via env in Docker / local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5437/arbitrage}
spring.datasource.username=${DATABASE_USERNAME:arbitrage}
spring.datasource.password=${DATABASE_PASSWORD:arbitrage}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8081

# Actuator — health only (Compose healthcheck; not exposed through Nginx)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging — INFO for app; keep framework noise down
logging.level.root=INFO
logging.level.com.cryptoarbitrage.monitor=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web.socket=INFO

# Exchange configuration
# Each adapter lists exactly the markets it offers under `markets.<INTERNAL_SYMBOL>`.
# Absence of an entry means the venue does not list that market — see MarketConfigValidator
# and ExchangeAdapter#supports, both of which read this config as the single source of truth.

