exchange.adapters.coinbase.base-url=https://api.exchange.coinbase.com
exchange.adapters.coinbase.connect-timeout-ms=5000
exchange.adapters.coinbase.response-timeout-ms=10000
# Always polled each cycle — protects rate limits when many markets are enabled client-side.
exchange.adapters.coinbase.core-symbols=BTC/USD,ETH/USD,SOL/USD,XRP/USD,DOGE/USD,BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT,DOGE/USDT
exchange.adapters.coinbase.expand-when-enabled-at-most=8
exchange.adapters.coinbase.markets.BTC_USD.native-symbol=BTC-USD
exchange.adapters.coinbase.markets.BTC_USD.quote-asset=USD
exchange.adapters.coinbase.markets.ETH_USD.native-symbol=ETH-USD
exchange.adapters.coinbase.markets.ETH_USD.quote-asset=USD
exchange.adapters.coinbase.markets.BTC_USDT.native-symbol=BTC-USDT
exchange.adapters.coinbase.markets.BTC_USDT.quote-asset=USDT
exchange.adapters.coinbase.markets.ETH_USDT.native-symbol=ETH-USDT
exchange.adapters.coinbase.markets.ETH_USDT.quote-asset=USDT
exchange.adapters.coinbase.markets.SOL_USD.native-symbol=SOL-USD
exchange.adapters.coinbase.markets.SOL_USD.quote-asset=USD
exchange.adapters.coinbase.markets.XRP_USD.native-symbol=XRP-USD
