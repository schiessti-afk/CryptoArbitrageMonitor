services:
  postgres:
    image: postgres:16-alpine
    container_name: cam-postgres
    environment:
      POSTGRES_DB: arbitrage
      POSTGRES_USER: arbitrage
      POSTGRES_PASSWORD: arbitrage
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbitrage -d arbitrage"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cam-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/arbitrage
      DATABASE_USERNAME: arbitrage
      DATABASE_PASSWORD: arbitrage
    depends_on:
      postgres:
        condition: service_healthy
    # Optional local debugging against the containerized API:
    # ports:
    #   - "8081:8081"

  frontend:
    build: ./frontend
    container_name: cam-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
